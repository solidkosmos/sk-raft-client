<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>xadc_top block diagram</title>
  <desc>The XADC sends each result to the result registers. A JTAG write to USER1 copies the results into a 160-bit snapshot. A JTAG read of USER2 returns the snapshot to the SK-RAFT server and to main.py.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="210" fill="#ffffff"/>

  <!-- FPGA boundary -->
  <rect x="10" y="10" width="640" height="190" rx="6" fill="#f4f7fb" stroke="#5b7aa6" stroke-dasharray="6 4"/>
  <text x="22" y="30" font-weight="bold" fill="#2b4a75">FPGA: xadc_top</text>

  <!-- XADC -->
  <rect x="25" y="60" width="135" height="110" rx="4" fill="#ffffff" stroke="#333"/>
  <text x="92" y="85" text-anchor="middle" font-weight="bold">XADC</text>
  <text x="92" y="105" text-anchor="middle">Temperature</text>
  <text x="92" y="122" text-anchor="middle">VCCINT, VCCAUX,</text>
  <text x="92" y="139" text-anchor="middle">VCCBRAM</text>
  <text x="92" y="156" text-anchor="middle">(+ PS supplies)</text>

  <!-- Result registers -->
  <rect x="250" y="60" width="120" height="110" rx="4" fill="#ffffff" stroke="#333"/>
  <text x="310" y="85" text-anchor="middle" font-weight="bold">Result</text>
  <text x="310" y="102" text-anchor="middle" font-weight="bold">registers</text>
  <text x="310" y="126" text-anchor="middle">one for each</text>
  <text x="310" y="143" text-anchor="middle">channel</text>

  <!-- Snapshot -->
  <rect x="430" y="60" width="140" height="110" rx="4" fill="#ffffff" stroke="#333"/>
  <text x="500" y="85" text-anchor="middle" font-weight="bold">Snapshot</text>
  <text x="500" y="106" text-anchor="middle">160 bits</text>
  <text x="500" y="126" text-anchor="middle">copied at each</text>
  <text x="500" y="143" text-anchor="middle">USER1 write</text>

  <!-- XADC to registers -->
  <line x1="160" y1="100" x2="248" y2="100" stroke="#333" marker-end="url(#arrow)"/>
  <text x="205" y="92" text-anchor="middle" font-size="11">DRP DO</text>
  <text x="205" y="125" text-anchor="middle" font-size="11">EOC = DEN</text>
  <text x="205" y="140" text-anchor="middle" font-size="11">CHANNEL</text>
  <text x="205" y="153" text-anchor="middle" font-size="11">= DADDR</text>

  <!-- registers to snapshot -->
  <line x1="370" y1="115" x2="428" y2="115" stroke="#333" marker-end="url(#arrow)"/>

  <!-- BSCAN USER1 / USER2 -->
  <rect x="590" y="50" width="50" height="50" rx="4" fill="#e8f0e8" stroke="#3d7a3d"/>
  <text x="615" y="72" text-anchor="middle" font-size="11" font-weight="bold">BSCAN</text>
  <text x="615" y="88" text-anchor="middle" font-size="11">USER1</text>
  <rect x="590" y="130" width="50" height="50" rx="4" fill="#e8f0e8" stroke="#3d7a3d"/>
  <text x="615" y="152" text-anchor="middle" font-size="11" font-weight="bold">BSCAN</text>
  <text x="615" y="168" text-anchor="middle" font-size="11">USER2</text>

  <!-- USER1 request to snapshot -->
  <line x1="590" y1="75" x2="572" y2="75" stroke="#3d7a3d" marker-end="url(#arrow)"/>
  <text x="580" y="44" text-anchor="middle" font-size="11" fill="#3d7a3d">request</text>
  <!-- snapshot to USER2 -->
  <path d="M570,155 L588,155" fill="none" stroke="#333" marker-end="url(#arrow)"/>

  <!-- JTAG to server -->
  <rect x="700" y="80" width="110" height="70" rx="4" fill="#ffffff" stroke="#333"/>
  <text x="755" y="108" text-anchor="middle" font-weight="bold">SK-RAFT</text>
  <text x="755" y="126" text-anchor="middle" font-weight="bold">server</text>
  <rect x="850" y="80" width="95" height="70" rx="4" fill="#ffffff" stroke="#333"/>
  <text x="897" y="110" text-anchor="middle" font-weight="bold">main.py</text>
  <text x="897" y="128" text-anchor="middle" font-size="11">skraft client</text>

  <path d="M698,95 L640,75" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <path d="M640,155 L698,135" fill="none" stroke="#333" marker-end="url(#arrow)"/>
  <text x="672" y="118" text-anchor="middle" font-size="11">JTAG</text>
  <line x1="812" y1="105" x2="848" y2="105" stroke="#333" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="830" y="127" text-anchor="middle" font-size="11">gRPC</text>
</svg>
