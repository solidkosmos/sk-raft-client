  <line x1="430.0" y1="308.0" x2="520.0" y2="378.0" stroke="#e8c383" stroke-width="1"/>
  <line x1="512.5" y1="297.5" x2="602.5" y2="367.5" stroke="#e8c383" stroke-width="1"/>
  <line x1="595.0" y1="287.0" x2="685.0" y2="357.0" stroke="#e8c383" stroke-width="1"/>
  <line x1="129.7" y1="373.1" x2="679.7" y2="303.1" stroke="#e8c383" stroke-width="1"/>
  <line x1="159.4" y1="396.2" x2="709.4" y2="326.2" stroke="#e8c383" stroke-width="1"/>
