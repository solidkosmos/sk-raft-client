  <circle cx="429.5" cy="142.5" r="4.5" fill="#a6322f"/>
  <circle cx="429.5" cy="332.5" r="4.5" fill="#a6322f"/>
  <text x="419.5" y="111.5" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#a6322f">FAULT</text>
  <line x1="492.0" y1="316.4" x2="492.0" y2="126.4" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowGray)"/>
  <line x1="569.5" y1="326.9" x2="569.5" y2="136.9" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowGray)"/>
