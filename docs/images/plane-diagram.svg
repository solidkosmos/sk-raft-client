<svg viewBox="0 0 900 500" width="900" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two physically stacked planes: an application plane holding live flip-flop and BRAM state above a configuration plane holding the bitstream (CRAM). A single fault can strike through both planes at the same location; dashed arrows show configuration driving application state.">
  <rect x="0" y="0" width="900" height="500" fill="#ffffff"/>

  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="450" y="24" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">Where a fault lands</text>
  <text x="450" y="44" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555555">Two physically stacked planes, one fault</text>

  <polygon points="100.0,160.0 650.0,90.0 740.0,160.0 190.0,230.0" fill="#eaf0ff" stroke="#2a4ea0" stroke-width="2"/>
  <polygon points="100.0,350.0 650.0,280.0 740.0,350.0 190.0,420.0" fill="#fff4de" stroke="#c97a1a" stroke-width="2"/>
