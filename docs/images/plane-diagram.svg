  <line x1="265.0" y1="139.0" x2="355.0" y2="209.0" stroke="#b9c9f0" stroke-width="1"/>
  <line x1="347.5" y1="128.5" x2="437.5" y2="198.5" stroke="#b9c9f0" stroke-width="1"/>
  <line x1="430.0" y1="118.0" x2="520.0" y2="188.0" stroke="#b9c9f0" stroke-width="1"/>
  <line x1="512.5" y1="107.5" x2="602.5" y2="177.5" stroke="#b9c9f0" stroke-width="1"/>
  <line x1="595.0" y1="97.0" x2="685.0" y2="167.0" stroke="#b9c9f0" stroke-width="1"/>
  <line x1="129.7" y1="183.1" x2="679.7" y2="113.1" stroke="#b9c9f0" stroke-width="1"/>
  <line x1="159.4" y1="206.2" x2="709.4" y2="136.2" stroke="#b9c9f0" stroke-width="1"/>
  <line x1="182.5" y1="339.5" x2="272.5" y2="409.5" stroke="#e8c383" stroke-width="1"/>
  <line x1="265.0" y1="329.0" x2="355.0" y2="399.0" stroke="#e8c383" stroke-width="1"/>
