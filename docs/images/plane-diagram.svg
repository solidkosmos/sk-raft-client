  <text x="690.0" y="237.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#666666">configuration</text>
  <text x="690.0" y="250.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#666666">drives application</text>
  <text x="690.0" y="263.5" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#666666">state</text>
  <text x="163.8" y="159.8" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1a2f66">APPLICATION PLANE</text>
  <text x="163.8" y="179.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#334">flip-flop &amp; BRAM content &#8212; runtime state</text>
  <text x="163.8" y="349.8" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a4b00">CONFIGURATION PLANE</text>
  <text x="163.8" y="369.8" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6b4300">CRAM &#8212; LUTs, routing, BRAM mode</text>
