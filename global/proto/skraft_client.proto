syntax = "proto3";

package proto;

import "google/protobuf/empty.proto";
option go_package = "bitbucket.org/sk_dev_team/sk-raft-software/cmd/sk_raft/proto";

service SKRaftFpga {
    rpc fpgaConnect(FpgaDeviceDetails) returns (google.protobuf.Empty) {}
    rpc fpgaClose(google.protobuf.Empty) returns (google.protobuf.Empty) {}

    rpc fpgaSetRbdFilePath(FilePath) returns (google.protobuf.Empty) {}
    rpc fpgaSetMsdFilePath(FilePath) returns (google.protobuf.Empty) {}
    rpc fpgaSetEbdFilePath(FilePath) returns (google.protobuf.Empty) {}
    rpc fpgaSetllFilePath(FilePath)  returns (google.protobuf.Empty) {}
    rpc fpgaSetBitFilePath(FilePath) returns (google.protobuf.Empty) {}

    rpc fpgaWriteBscan(FpgaBscanTarget) returns (FpgaBscanOutput) {}

    rpc fpgaCramBits(google.protobuf.Empty) returns (FpgaBitCount) {}
    rpc fpgaEssentialCramBits(google.protobuf.Empty) returns (FpgaBitCount) {}
    rpc fpgaBramBits(google.protobuf.Empty) returns (FpgaBitCount) {}
    rpc fpgaFlipFlopBits(google.protobuf.Empty) returns (FpgaBitCount) {}
    rpc fpgaLutramBits(google.protobuf.Empty) returns (FpgaBitCount) {}

    rpc fpgaBitFlip(FpgaInjectionTarget) returns (google.protobuf.Empty) {}
    rpc fpgaRandomBitFlip(FpgaRandomInjectionOptions) returns (FpgaRandomInjectionReport) {}

    rpc fpgaFaultInjection(FpgaFiSession)  returns (FpgaFiSummary) {}

    rpc fpgaProgram(google.protobuf.Empty) returns (google.protobuf.Empty) {}

    rpc fpgaExtractFarsFromBitstream(FpgaFarListExtractRequest) returns (FpgaFarListExtractResult) {}

    rpc fpgaExcludeFars(FpgaFarListExcludeRequest) returns (google.protobuf.Empty) {}

    rpc fpgaReadBack(FpgaReadbackTarget) returns (FpgaReadbackDetail) {}
}

message FpgaBitCount {
    uint32 value = 1;
}

message FpgaWord {
    repeated uint32 values = 1;
}

message FpgaFarListExtractRequest {
    string bitstreamPath = 1;
}

message FpgaFarListExtractResult {
    repeated  uint32 values = 1;
}

message FpgaFarListExcludeRequest {
    repeated uint32 values = 1;
}

message FpgaFrame {
    uint32 frameAddress     = 1;
    repeated FpgaWord words = 2;
}

message FpgaReadbackDetail {
    repeated FpgaFrame frames = 1;
}

message FpgaReadbackTarget {
    uint32 startFrameAddress = 1;
    uint32 endFrameAddress   = 2;
}

message FpgaDeviceDetails {
    string devicePartNumber     = 1;
    string programmerPartNumber = 2;
}

message FpgaBscanTarget {
    uint32 userRegisterId  = 1;
    bytes value            = 2;
    uint32 usefulBits = 3;
}

message FpgaBscanOutput {
    bytes value = 2;
}

message FpgaInjectionTarget {
    uint32 frameAddress = 1;
    uint32 wordIndex    = 2;
    uint32 bitIndex     = 3;
    bool isFlipFlop     = 4;
    bool isLutRam       = 5;
    bool isBram         = 6;
    string netName      = 7;
}

message FpgaRandomInjectionReport {
    FpgaInjectionTarget target = 1;
}

message FpgaRandomInjectionOptions {
    bool includeEssential = 1;
    bool includeFlipFlops = 2;
    bool includeLutRams   = 3;
    bool includeBrams     = 4;
}

message FilePath {
    string path = 1;
}

message FpgaFiSession {
    uint32 type              = 1;
    uint32 duration          = 2;
    uint32 correctionTime    = 3;
    uint32 timeBetweenFaults = 4;
    float sbuPercent         = 5;
    float mbuPercent         = 6;
    float mcuPercent         = 7;
    bool essential           = 8;
    bool correct             = 9;
} 

message FpgaWordSummary {
    uint32 far               = 1;
    uint32 wordIndex         = 2;
    uint32 bitIndex          = 3;
    uint32 goldenWordValue   = 4;
    uint32 injectedWordValue = 5;
    bool isEssential         = 6;
}

message FpgaFiSummary {
    uint32 type                          = 1;
    uint32 duration                      = 2;
    uint32 correctionTime                = 3;
    uint32 timeBetweenFaults             = 4;
    repeated FpgaWordSummary wordSummary = 5;
}
